<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Student — Student CRUD</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Student CRUD</div>
      <nav>
        <a href="form.html" class="nav-link active">Add Student</a>
        <a href="students.html" class="nav-link">Students</a>
        <a href="#" id="logoutLink" class="nav-link">Logout</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <aside class="sidebar">
      <div class="sidebar-card">
        <h3>Admin</h3>
        <p class="muted">Logged in as <strong>admin</strong></p>
        <hr/>
        <p class="muted small">Quick actions</p>
        <button id="goStudents" class="btn outline block">View Students</button>
      </div>
    </aside>

    <section class="main-content">
      <div class="card">
        <h2>Add New Student</h2>
        <form id="studentForm" class="form">
          <div class="grid-2">
            <label>Name <input name="name" id="name" required></label>
            <label>Number <input name="number" id="number" required></label>
          </div>
          <div class="grid-2">
            <label>Email <input name="email" id="email" type="email"></label>
            <label>Class <input name="className" id="className"></label>
          </div>
          <label>Address <textarea name="address" id="address" rows="4"></textarea></label>

          <div class="buttons">
            <button class="btn primary" type="submit">Save & View</button>
            <button class="btn outline" type="button" id="clearBtn">Clear</button>
          </div>
        </form>
      </div>

      <div class="card muted small">
        <strong>Tip:</strong> After saving you'll be redirected to the Students list.
      </div>
    </section>
  </main>

  <script src="assets/script.js"></script>
  <script>
    // Protect page
    if (!isLoggedIn()) location.href = 'login.html';

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      logout();
      location.href = 'login.html';
    });

    document.getElementById('goStudents').addEventListener('click', () => {
      location.href = 'students.html';
    });

    // Form handling
    const form = document.getElementById('studentForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const student = {
        id: Date.now().toString(),
        name: document.getElementById('name').value.trim(),
        number: document.getElementById('number').value.trim(),
        email: document.getElementById('email').value.trim(),
        className: document.getElementById('className').value.trim(),
        address: document.getElementById('address').value.trim(),
      };
      if (!student.name || !student.number) {
        alert('Please enter Name and Number');
        return;
      }
      createStudent(student);
      // redirect to list page
      location.href = 'students.html';
    });

    document.getElementById('clearBtn').addEventListener('click', () => form.reset());
  </script>
</body>
</html>
